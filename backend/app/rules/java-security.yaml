rules:
- id: codely.java.sql-concatenation
  languages:
  - java
  severity: WARNING
  message: Review concatenated SQL and bind dynamic values using a parameterized
    query. The pattern does not establish input provenance.
  metadata:
    title: Concatenated SQL at execution
    description: Detects Java JDBC Statement execution calls receiving concatenated SQL strings.
    severity: MEDIUM
    cwe:
    - CWE-89
    owasp:
    - A03:2021 - Injection
    remediation: Use PreparedStatement with bound query parameters instead of string concatenation.
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
  pattern-either:
  - pattern: $STMT.executeQuery($LEFT + $RIGHT)
  - pattern: $STMT.executeUpdate($LEFT + $RIGHT)
  - pattern: $STMT.execute($LEFT + $RIGHT)
- id: codely.java.command-concatenation
  languages:
  - java
  severity: WARNING
  message: Use a fixed program and validated arguments. The pattern does not
    establish whether input is untrusted.
  metadata:
    title: Concatenated string passed to command execution
    description: Detects Runtime.exec invoked with a concatenated command string.
    severity: MEDIUM
    cwe:
    - CWE-78
    owasp:
    - A03:2021 - Injection
    remediation: Use ProcessBuilder with a fixed executable and explicit argument list, avoiding shell interpolation.
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
  pattern: Runtime.getRuntime().exec($LEFT + $RIGHT, ...)
- id: codely.java.object-stream
  languages:
  - java
  severity: WARNING
  message: Review whether serialized input is trusted and use an object input
    filter or a safer format.
  metadata:
    title: Java object deserialization
    description: Detects ObjectInputStream construction which can deserialize arbitrary gadget classes if input is untrusted.
    severity: MEDIUM
    cwe:
    - CWE-502
    owasp:
    - A08:2021 - Software and Data Integrity Failures
    remediation: Prefer JSON or structured data formats, or configure a strict ObjectInputFilter allowlist.
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
  pattern: new java.io.ObjectInputStream(...)
- id: codely.java.weak-digest
  languages:
  - java
  severity: WARNING
  message: Review MD5 or SHA-1 use. A checksum use may be intentional, but these
    algorithms are unsuitable for security-sensitive integrity or password
    storage.
  metadata:
    title: Legacy message-digest algorithm
    description: Detects MessageDigest.getInstance calls requesting MD5 or SHA-1.
    severity: MEDIUM
    cwe:
    - CWE-327
    owasp:
    - A02:2021 - Cryptographic Failures
    remediation: Use SHA-256/SHA-3 for integrity digests and Argon2/bcrypt/PBKDF2 for password hashing.
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
  pattern-either:
  - pattern: java.security.MessageDigest.getInstance("MD5", ...)
  - pattern: java.security.MessageDigest.getInstance("SHA-1", ...)
- id: codely.java.xml-factory
  languages:
  - java
  severity: INFO
  message: Verify the parser disables external entities and DTDs when handling
    untrusted XML. Factory creation alone does not determine the effective
    configuration.
  metadata:
    title: XML parser factory requires review
    description: Detects DocumentBuilderFactory.newInstance usage where XXE protections must be verified.
    severity: LOW
    cwe:
    - CWE-611
    owasp:
    - A05:2021 - Security Misconfiguration
    remediation: Disable DOCTYPE declarations and external general/parameter entities on DocumentBuilderFactory.
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
  pattern: javax.xml.parsers.DocumentBuilderFactory.newInstance(...)
- id: codely.java.permissive-hostname-verifier
  languages:
  - java
  severity: WARNING
  message: A verifier that always accepts names bypasses hostname verification.
    Use the platform TLS verifier.
  metadata:
    title: Permissive TLS hostname verifier
    description: Detects HostnameVerifier lambdas that unconditionally return true.
    severity: MEDIUM
    cwe:
    - CWE-297
    owasp:
    - A02:2021 - Cryptographic Failures
    remediation: Remove permissive hostname verifiers and rely on standard platform TLS hostname verification.
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html
  pattern-either:
  - pattern: $CONNECTION.setHostnameVerifier(($HOST, $SESSION) -> true)
  - pattern: $CONNECTION.setDefaultHostnameVerifier(($HOST, $SESSION) -> true)
- id: codely.java.csrf-disabled
  languages:
  - java
  severity: WARNING
  message: Review whether disabling CSRF is appropriate for the authentication
    and client model.
  metadata:
    title: Spring Security CSRF protection disabled
    description: Detects explicit CSRF disabling in Spring Security HttpSecurity configuration.
    severity: MEDIUM
    cwe:
    - CWE-352
    owasp:
    - A05:2021 - Security Misconfiguration
    remediation: Keep CSRF protection enabled for cookie/session-authenticated browser endpoints.
    references:
    - https://docs.spring.io/spring-security/reference/features/exploits/csrf.html
  pattern-either:
  - pattern: $HTTP.csrf().disable()
  - pattern: $HTTP.csrf($CSRF -> $CSRF.disable())
- id: codely.java.credential-literal
  languages:
  - java
  severity: WARNING
  message: Review this credential-like variable initialized with a literal. Confirm it is a placeholder or load its value from a secret store.
  metadata:
    title: Credential-like Java literal
    description: Detects Java String fields/variables named like credentials initialized with non-empty string literals.
    severity: MEDIUM
    cwe:
    - CWE-798
    owasp:
    - A07:2021 - Identification and Authentication Failures
    remediation: Inject secrets from environment variables or a managed secret store rather than hardcoding literals.
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
  pattern-regex: '(?i)\bString\s+(?:password|apiKey|clientSecret)\s*=\s*"[^"\r\n]{6,}"'
- id: codely.java.open-redirect
  languages:
  - java
  severity: WARNING
  message: Review redirect target construction and validate destinations against an allowlist of local routes or trusted hosts.
  metadata:
    title: Concatenated redirect target
    description: Detects Spring ModelAndView redirect concatenation or HttpServletResponse.sendRedirect with concatenated input.
    severity: MEDIUM
    cwe:
    - CWE-601
    owasp:
    - A01:2021 - Broken Access Control
    remediation: Validate redirect destinations against a fixed allowlist of relative routes or trusted origins.
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
  pattern-either:
  - pattern: new ModelAndView("redirect:" + $TARGET)
  - pattern: $RESP.sendRedirect($LEFT + $RIGHT)
- id: codely.java.insecure-cookie
  languages:
  - java
  severity: WARNING
  message: Review explicit disabling of HttpOnly or Secure flags on cookies.
  metadata:
    title: Insecure Java cookie flag
    description: Detects explicit calls setting HttpOnly or Secure to false on Java Cookie objects.
    severity: MEDIUM
    cwe:
    - CWE-614
    owasp:
    - A05:2021 - Security Misconfiguration
    remediation: Set both HttpOnly(true) and Secure(true) on session and authentication cookies.
    references:
    - https://owasp.org/www-community/controls/SecureCookieAttribute
  pattern-either:
  - pattern: $COOKIE.setHttpOnly(false)
  - pattern: $COOKIE.setSecure(false)
